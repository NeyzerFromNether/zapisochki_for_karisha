        p2: "я люблю тебя очень сильно кариш ты самая прекрасная моя девочка и я невероятно счастлив что ты у меня есть!"
      }
    ];

    const notes = document.getElementById('notes');
    const dialog = document.getElementById('messageDialog');
    const title = document.getElementById('dialogTitle');
    const count = document.getElementById('dialogCount');
    const p1 = document.getElementById('dialogP1');
    const p2 = document.getElementById('dialogP2');
    let last = -1;

    messages.forEach((message, i) => {
      const card = document.createElement('button');
      card.className = 'note';
      card.innerHTML = `<span class="note-number">записочка ${String(i + 1).padStart(2, '0')}</span><span class="note-name">${message.title}</span><span class="open-label">открыть меня</span>`;
      card.addEventListener('click', () => openMessage(i));
      notes.appendChild(card);
    });

    function openMessage(index){
      const message = messages[index];
      last = index;
      count.textContent = `маленькая записочка ${String(index + 1).padStart(2, '0')} из ${messages.length}`;
      title.textContent = message.title;
      p1.textContent = message.p1;
      p2.textContent = message.p2;
      dialog.showModal();
    }

    document.getElementById('randomNote').addEventListener('click', () => {
      let next = Math.floor(Math.random() * messages.length);
      if(messages.length > 1 && next === last) next = (next + 1) % messages.length;
      openMessage(next);
    });
    document.getElementById('closeDialog').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', e => { if(e.target === dialog) dialog.close(); });

    document.getElementById('heart').addEventListener('click', e => {
      const r = e.currentTarget.getBoundingClientRect();
      for(let i=0;i<7;i++){
        const heart = document.createElement('span');
        heart.className = 'float'; heart.textContent = i % 3 === 0 ? '♥' : '♡';
        heart.style.left = `${r.left + r.width / 2 + (Math.random() - .5) * 80}px`;
        heart.style.top = `${r.top + 15 + Math.random() * 10}px`;
        heart.style.animationDelay = `${i * .07}s`;
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1800);
      }
    });
  </script>
